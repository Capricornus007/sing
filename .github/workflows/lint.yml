name: lint

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/lint.yml'
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    name: Lint ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
          - goos: linux
            goarch: '386'
          # 用戶 2026-10-11 裁：非 Linux/Android 的矩陣目標整條刪
          # （windows amd64/386/arm64、darwin amd64/arm64、freebsd amd64 已移除）。
          - goos: android
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Go from the feed (golang/go master tip)
        uses: Capricornus007/repo/.github/actions/setup-feed-go@master
      - name: Cache go module
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
          key: go-${{ hashFiles('**/go.sum') }}
      # 不能用 golangci-lint-action / go install：它釘 x/tools v0.50.0，讀不了 go tip 的
      # std export data（實測 v0.50 ✗、v0.51 ✓、v0.52 ✓）→ Lint 必紅。換依賴重 build
      # 的步驟與交叉表在 feed 倉 .github/actions/setup-gcl。
      - name: Install golangci-lint that reads Go tip export data
        uses: Capricornus007/repo/.github/actions/setup-gcl@master
        with:
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}
      - name: golangci-lint
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: golangci-lint run --timeout=30m
